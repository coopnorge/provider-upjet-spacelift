apiVersion: environmentvariable.spacelift.crossplane.io/v1alpha1
kind: EnvironmentVariable 
metadata:
  annotations:
    meta.crossplane.io/example-id: environmentvariable/v1alpha1/environmentvariable
  labels:
    testing.crossplane.io/example-name: exampleenvironmentvariable
  name: exampleenvironmentvariable
spec:
  forProvider:
    name: exampleenvironmentvariable
    valueSecretRef:
      key: example
      name: exampleenvsecret
      namespace: default
    writeOnly: false
    contextIdRef: 
      name: example-context
--- 
apiVersion: v1
kind: Secret
metadata:
  name: exampleenvsecret
stringData:
  example: bababooey